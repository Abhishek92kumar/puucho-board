<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Digiboard Pro - High DPI Canvas</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <!-- MathJax for LaTeX Rendering -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            startup: { typeset: false } // We render manually on load
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; color: white; font-family: sans-serif; }
        
        /* The infinite board area */
        #board-wrapper { width: 100%; height: 5000px; position: relative; background-color: #0f172a; transform-origin: top left; transition: transform 0.1s ease-out; }
        
        /* Layer 1: HTML Content (Text, LaTeX, Images) */
        #html-content { position: absolute; top: 0; left: 0; width: 100%; padding: 40px 60px; z-index: 10; pointer-events: auto; }
        #html-content img { max-width: 90%; border-radius: 8px; margin: 15px 0; border: 2px solid #334155; background: white; }
        
        /* Layer 2: High DPI Canvas Layers */
        canvas { position: absolute; top: 0; left: 0; touch-action: none; transform-origin: top left; }
        #drawCanvas { z-index: 20; }
        #tempCanvas { z-index: 30; cursor: crosshair; }

        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

        .tool-btn { padding: 10px; border-radius: 8px; color: #94a3b8; transition: all 0.2s; border: 2px solid transparent; font-size: 1.25rem; display: flex; align-items: center; justify-content: center;}
        .tool-btn:hover { background-color: #334155; color: white; }
        .tool-btn.active { background-color: #1e293b; color: white; border-color: #3b82f6; }

        .color-btn { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.1s; }
        .color-btn.active { border-color: white; transform: scale(1.15); box-shadow: 0 0 10px currentColor; }
    </style>
</head>
<body class="flex h-screen">

    <!-- SIDEBAR -->
    <div class="w-80 bg-slate-800 border-r border-slate-700 flex flex-col shadow-2xl z-50 shrink-0">
        <div class="p-6 border-b border-slate-700 bg-slate-900 space-y-4">
            <h2 class="text-xl font-bold">Problem Bank</h2>
            
            <!-- Upload & Export Buttons -->
            <div class="flex space-x-2">
                <label class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white font-bold text-sm rounded-lg cursor-pointer transition flex items-center justify-center text-center">
                    Upload
                    <input type="file" class="hidden" accept=".xlsx, .xls, .csv" onchange="loadExcel(event)">
                </label>
                <button onclick="exportExcel()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm rounded-lg transition flex items-center justify-center">
                    Export
                </button>
            </div>

            <!-- Subtopic Filter -->
            <div id="filter-container" class="hidden pt-2 border-t border-slate-700">
                <label class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1 block">Filter by Subtopic</label>
                <select id="subtopic-filter" onchange="filterProblems()" class="w-full bg-slate-700 border border-slate-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2">
                    <option value="ALL">All Subtopics</option>
                </select>
            </div>
        </div>
        
        <div id="problem-list" class="flex-1 overflow-y-auto custom-scroll p-4 space-y-2">
            <div class="text-center text-slate-500 mt-10">No questions loaded.</div>
        </div>
    </div>

    <!-- MAIN BOARD AREA -->
    <div class="flex-1 flex flex-col relative bg-slate-900 overflow-hidden">
        
        <!-- TOP TOOLBAR -->
        <div class="h-20 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 z-50 shrink-0 shadow-lg">
            
            <!-- Drawing Tools -->
            <div class="flex items-center space-x-1 bg-slate-900 p-1.5 rounded-xl border border-slate-700">
                <button onclick="setTool('pan')" id="tool-pan" class="tool-btn" title="Pan / Scroll">✋</button>
                <div class="w-px h-6 bg-slate-700 mx-1"></div>
                <button onclick="setTool('pen')" id="tool-pen" class="tool-btn active" title="Pen">✏️</button>
                <button onclick="setTool('eraser')" id="tool-eraser" class="tool-btn" title="Eraser">🧽</button>
                <div class="w-px h-6 bg-slate-700 mx-1"></div>
                <button onclick="setTool('rect')" id="tool-rect" class="tool-btn" title="Rectangle">▭</button>
                <button onclick="setTool('circle')" id="tool-circle" class="tool-btn" title="Circle">◯</button>
                <button onclick="setTool('triangle')" id="tool-triangle" class="tool-btn" title="Triangle">△</button>
                <button onclick="setTool('arrow')" id="tool-arrow" class="tool-btn" title="Arrow">↗</button>
            </div>

            <!-- Pen Thickness -->
            <div class="flex flex-col items-center justify-center px-4">
                <input type="range" id="penSize" min="1" max="30" value="4" class="w-24 cursor-pointer" oninput="updateContextStyles()">
            </div>

            <!-- Colors -->
            <div class="flex items-center space-x-3 bg-slate-900 p-2 rounded-xl border border-slate-700">
                <div onclick="setColor('#ffffff')" class="color-btn active bg-[#ffffff] text-[#ffffff]" id="color-white"></div>
                <div onclick="setColor('#fde047')" class="color-btn bg-[#fde047] text-[#fde047]" id="color-yellow"></div>
                <div onclick="setColor('#67e8f9')" class="color-btn bg-[#67e8f9] text-[#67e8f9]" id="color-cyan"></div>
                <div onclick="setColor('#86efac')" class="color-btn bg-[#86efac] text-[#86efac]" id="color-green"></div>
                <div onclick="setColor('#f9a8d4')" class="color-btn bg-[#f9a8d4] text-[#f9a8d4]" id="color-pink"></div>
            </div>
            
            <!-- Zoom Controls -->
            <div class="flex items-center space-x-2 bg-slate-900 p-1.5 rounded-xl border border-slate-700">
                <button onclick="adjustZoom(-0.1)" class="px-2 text-slate-300 hover:text-white font-bold">-</button>
                <span id="zoom-text" class="text-xs text-slate-300 w-10 text-center">100%</span>
                <button onclick="adjustZoom(0.1)" class="px-2 text-slate-300 hover:text-white font-bold">+</button>
                <button onclick="resetZoom()" class="px-2 text-xs text-blue-400 hover:text-blue-300">Reset</button>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Toggle Answer Button -->
                <button onclick="toggleAnswer()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-bold rounded-lg border border-slate-600 transition">
                    Toggle Answer
                </button>
                <button onclick="clearInk()" class="px-4 py-2 bg-red-900/50 hover:bg-red-800 text-red-200 text-sm font-bold rounded-lg border border-red-800 transition">
                    Clear
                </button>
            </div>
        </div>

        <!-- Answer Display Area (Hidden by default) -->
        <div id="answer-display" class="hidden absolute top-24 right-8 bg-green-900 border-2 border-green-500 text-green-100 font-bold px-6 py-3 rounded-xl shadow-2xl z-50 text-xl">
            Answer: <span id="answer-value"></span>
        </div>

        <!-- SCROLLABLE CANVAS CONTAINER -->
        <div id="scroll-container" class="flex-1 overflow-y-auto overflow-x-hidden custom-scroll relative">
            <div id="board-wrapper">
                <div id="html-content" class="text-3xl leading-relaxed text-slate-100">
                    <div class="text-center text-slate-500 mt-20">Select a problem from the sidebar to begin.</div>
                </div>
                
                <canvas id="drawCanvas"></canvas>
                <canvas id="tempCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // State
        let allProblems = [];
        let filteredProblems = [];
        let tool = 'pen';
        let color = '#ffffff';
        let isDrawing = false;
        let startX = 0, startY = 0;
        let currentZoom = 1.0;
        window.currentAnswer = "";

        // Elements
        const boardWrapper = document.getElementById('board-wrapper');
        const drawCanvas = document.getElementById('drawCanvas');
        const tempCanvas = document.getElementById('tempCanvas');
        const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });
        const tempCtx = tempCanvas.getContext('2d');

        // --- HIGH DPI CANVAS SETUP ---
        function setupCanvases() {
            const w = boardWrapper.clientWidth;
            const h = boardWrapper.clientHeight;
            const dpr = window.devicePixelRatio || 1;

            drawCanvas.width = w * dpr;
            drawCanvas.height = h * dpr;
            tempCanvas.width = w * dpr;
            tempCanvas.height = h * dpr;

            drawCanvas.style.width = w + 'px';
            drawCanvas.style.height = h + 'px';
            tempCanvas.style.width = w + 'px';
            tempCanvas.style.height = h + 'px';

            drawCtx.scale(dpr, dpr);
            tempCtx.scale(dpr, dpr);

            updateContextStyles();
        }
        
        window.addEventListener('resize', () => {
            const inkData = drawCanvas.toDataURL();
            setupCanvases();
            const img = new Image();
            img.onload = () => {
                drawCtx.save();
                drawCtx.setTransform(1, 0, 0, 1, 0, 0);
                drawCtx.drawImage(img, 0, 0);
                drawCtx.restore();
            };
            img.src = inkData;
        });

        // --- ZOOM LOGIC ---
        function adjustZoom(delta) {
            currentZoom += delta;
            if(currentZoom < 0.2) currentZoom = 0.2;
            if(currentZoom > 3.0) currentZoom = 3.0;
            applyZoom();
        }
        function resetZoom() {
            currentZoom = 1.0;
            applyZoom();
        }
        function applyZoom() {
            boardWrapper.style.transform = `scale(${currentZoom})`;
            document.getElementById('zoom-text').innerText = Math.round(currentZoom * 100) + '%';
        }

        // --- EXCEL LOGIC ---
        function loadExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawJson = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                let subtopics = new Set();
                
                allProblems = rawJson.map((row, index) => {
                    // Extract needed columns, checking common naming variations
                    const qHtml = row['questionHtml'] || row['QuestionHtml'] || row['QuestionHTML'] || row['Question'] || "No question HTML found.";
                    const subtopic = row['subtopic'] || row['Subtopic'] || "Uncategorized";
                    const subject = row['subject'] || row['Subject'] || "";
                    const chapter = row['chapter'] || row['Chapter'] || "";
                    
                    // SMART SCANNER FOR CORRECT INDEX
                    let answer = "Not provided";
                    for (const key in row) {
                        const normalizedKey = key.toLowerCase().replace(/\s+/g, ''); // Removes spaces and makes lowercase
                        if (normalizedKey === 'correctindex' || normalizedKey === 'answer') {
                            answer = row[key];
                            break;
                        }
                    }
                    
                    if(subtopic !== "Uncategorized") subtopics.add(subtopic);

                    return { id: index + 1, html: qHtml, subtopic: subtopic, subject: subject, chapter: chapter, answer: answer };
                }).filter(p => p.html.trim() !== "");

                const filterDropdown = document.getElementById('subtopic-filter');
                filterDropdown.innerHTML = '<option value="ALL">All Subtopics</option>';
                Array.from(subtopics).sort().forEach(st => {
                    filterDropdown.innerHTML += `<option value="${st}">${st}</option>`;
                });
                
                document.getElementById('filter-container').classList.remove('hidden');
                filterProblems(); 
            };
            reader.readAsArrayBuffer(file);
        }

        function exportExcel() {
            if(allProblems.length === 0) return alert("No problems to export!");
            const ws = XLSX.utils.json_to_sheet(allProblems);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Questions");
            XLSX.writeFile(wb, "Problem_Bank_Export.xlsx");
        }

        function filterProblems() {
            const selected = document.getElementById('subtopic-filter').value;
            filteredProblems = (selected === "ALL") ? allProblems : allProblems.filter(p => p.subtopic === selected);
            renderSidebar();
        }

        function renderSidebar() {
            const list = document.getElementById('problem-list');
            list.innerHTML = '';
            
            if (filteredProblems.length === 0) {
                list.innerHTML = '<div class="text-center text-slate-500 mt-10">No questions found.</div>';
                return;
            }

            filteredProblems.forEach(prob => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 bg-slate-700 hover:bg-slate-600 rounded-lg mb-2 transition border border-slate-600 focus:border-blue-400";
                btn.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-lg text-blue-400 font-extrabold">Q${prob.id}</span>
                        <span class="text-xs text-slate-400 font-semibold uppercase">${prob.subject}</span>
                    </div>
                    <div class="text-xs text-slate-300 font-medium line-clamp-2">${prob.subtopic}</div>
                `;
                btn.onclick = () => loadProblemToBoard(prob);
                list.appendChild(btn);
            });
        }

        function loadProblemToBoard(prob) {
            clearInk();
            
            // Hide answer from previous problem
            document.getElementById('answer-display').classList.add('hidden');
            window.currentAnswer = prob.answer;
            
            const contentDiv = document.getElementById('html-content');
            
            let presentationHtml = `<div class="question-body text-slate-100 font-medium">${prob.html}</div>`;
            presentationHtml += `<div class="mt-16 pt-8 border-t border-slate-700"><div class="flex flex-wrap gap-3 mb-8">`;
            if(prob.subject) presentationHtml += `<span class="px-4 py-1.5 rounded-full bg-indigo-900/50 text-indigo-300 text-sm font-bold border border-indigo-700/50">${prob.subject}</span>`;
            if(prob.chapter) presentationHtml += `<span class="px-4 py-1.5 rounded-full bg-emerald-900/50 text-emerald-300 text-sm font-bold border border-emerald-700/50">${prob.chapter}</span>`;
            if(prob.subtopic) presentationHtml += `<span class="px-4 py-1.5 rounded-full bg-sky-900/50 text-sky-300 text-sm font-bold border border-sky-700/50">${prob.subtopic}</span>`;
            presentationHtml += `</div></div>`;
            
            contentDiv.innerHTML = presentationHtml;
            
            // MATHJAX FIX: Clear previous typesetting cache, then promise new render
            MathJax.typesetClear();
            MathJax.typesetPromise([contentDiv]).catch((err) => console.log(err));
            
            document.getElementById('scroll-container').scrollTop = 0;
            if(tool === 'pan') setTool('pen');
        }

        function toggleAnswer() {
            const ansDiv = document.getElementById('answer-display');
            if (ansDiv.classList.contains('hidden')) {
                document.getElementById('answer-value').innerText = window.currentAnswer || "Not Found";
                ansDiv.classList.remove('hidden');
            } else {
                ansDiv.classList.add('hidden');
            }
        }

        // --- DRAWING LOGIC ---
        function setTool(newTool) {
            tool = newTool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
            
            tempCanvas.style.pointerEvents = (tool === 'pan') ? 'none' : 'auto';
            updateContextStyles();
        }

        function setColor(newColor) {
            color = newColor;
            document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
            const colorMap = {'#ffffff':'white', '#fde047':'yellow', '#67e8f9':'cyan', '#86efac':'green', '#f9a8d4':'pink'};
            document.getElementById(`color-${colorMap[newColor]}`).classList.add('active');
            if (tool === 'eraser' || tool === 'pan') setTool('pen'); 
            else updateContextStyles();
        }

        function clearInk() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
        }

        function updateContextStyles() {
            const thickness = document.getElementById('penSize').value;
            [drawCtx, tempCtx].forEach(ctx => {
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = thickness;
            });
            tempCtx.strokeStyle = color;
            tempCtx.fillStyle = 'transparent';
            
            if (tool === 'eraser') {
                drawCtx.globalCompositeOperation = 'destination-out';
                drawCtx.lineWidth = thickness * 4; 
            } else {
                drawCtx.globalCompositeOperation = 'source-over';
                drawCtx.strokeStyle = color;
            }
        }

        function getPos(e) {
            const rect = tempCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // Adjust coordinates taking CSS Zoom scale into account
            return { 
                x: (clientX - rect.left) / currentZoom, 
                y: (clientY - rect.top) / currentZoom 
            };
        }

        function drawArrow(ctx, x1, y1, x2, y2) {
            const headlen = 25;
            const angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        }

        function drawTriangle(ctx, x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1 + (x2 - x1) / 2, y1);
            ctx.lineTo(x2, y2);
            ctx.lineTo(x1, y2);
            ctx.closePath();
            ctx.stroke();
        }

        tempCanvas.addEventListener('mousedown', startDraw);
        tempCanvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', endDraw);
        tempCanvas.addEventListener('touchstart', startDraw, {passive: false});
        tempCanvas.addEventListener('touchmove', draw, {passive: false});
        window.addEventListener('touchend', endDraw);

        function startDraw(e) {
            if (tool === 'pan') return;
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            startX = pos.x;
            startY = pos.y;
            if (tool === 'pen' || tool === 'eraser') {
                drawCtx.beginPath();
                drawCtx.moveTo(startX, startY);
                drawCtx.lineTo(startX, startY);
                drawCtx.stroke();
            }
        }

        function draw(e) {
            if (!isDrawing || tool === 'pan') return;
            e.preventDefault();
            const pos = getPos(e);

            if (tool === 'pen' || tool === 'eraser') {
                drawCtx.lineTo(pos.x, pos.y);
                drawCtx.stroke();
            } else {
                tempCtx.clearRect(0, 0, tempCanvas.width / (window.devicePixelRatio||1), tempCanvas.height / (window.devicePixelRatio||1));
                tempCtx.beginPath();
                if (tool === 'rect') tempCtx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
                else if (tool === 'circle') {
                    const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                    tempCtx.arc(startX, startY, radius, 0, 2 * Math.PI);
                    tempCtx.stroke();
                } 
                else if (tool === 'triangle') drawTriangle(tempCtx, startX, startY, pos.x, pos.y);
                else if (tool === 'arrow') drawArrow(tempCtx, startX, startY, pos.x, pos.y);
            }
        }

        function endDraw(e) {
            if (!isDrawing) return;
            isDrawing = false;
            if (tool !== 'pen' && tool !== 'eraser' && tool !== 'pan') {
                const prevOp = drawCtx.globalCompositeOperation;
                drawCtx.globalCompositeOperation = 'source-over';
                
                // For High DPI, we must temporarily unscale to stamp the temp canvas perfectly
                drawCtx.save();
                drawCtx.setTransform(1, 0, 0, 1, 0, 0); 
                drawCtx.drawImage(tempCanvas, 0, 0);
                drawCtx.restore();
                
                drawCtx.globalCompositeOperation = prevOp;
                tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
            }
        }

        setupCanvases();
    </script>
</body>
</html>
